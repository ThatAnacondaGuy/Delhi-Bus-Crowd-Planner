# Pre-registered expectations. Committed before any model output exists (18 Nov 2026).
# Corridors chosen from external evidence only (docs/superpowers/specs/2026-11-18-phase1-research-notes.md, section 1).
# Stop names are exact stop_name values from the real GTFS stops.txt; research-note names that do not
# exist exactly were dropped. Misses are reported, not tuned away.
peaks:
  am:
  - 8
  - 10
  pm:
  - 17
  - 20
weekend:
  lower: true
  flatter: true
  later_peak: true
radial:
  inbound_am: true
  outbound_pm: true
  inbound_definition: towards the terminal nearer CP/ITO
corridor_hit_rule: A corridor counts as a hit if at least one of its mapped stretches is in the network's
  top decile of weekday crowded rider-minutes per km in its stated peak window (or either peak if none
  is stated). Hits are reported by evidence grade. Misses are reported, not tuned away.
