<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plan a Delhi bus journey and see how crowded each bus usually is.">
  <title>Delhi bus crowding planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <aside id="demo-banner" class="demo-banner" role="note" hidden></aside>
  <header class="top">
    <h1 class="brand" data-t="title">Delhi bus crowding</h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="lang-btn" data-lang="hi" aria-pressed="false" lang="hi">हिं</button>
    </div>
  </header>

  <main id="main">
    <section class="query" aria-label="Your trip">
      <button type="button" id="summary" class="summary" aria-expanded="false" aria-controls="form">
        <span id="summary-text" class="summary-text"></span>
        <span class="summary-edit" data-t="change">Change</span>
      </button>

      <form id="form" class="form" hidden novalidate>
        <label class="field"><span data-t="from">From</span>
          <input id="from" name="from" type="text" list="places" autocomplete="off" autocapitalize="words" required maxlength="120">
        </label>
        <label class="field"><span data-t="to">To</span>
          <input id="to" name="to" type="text" list="places" autocomplete="off" autocapitalize="words" required maxlength="120">
        </label>
        <datalist id="places"></datalist>
        <div class="row">
          <label class="field field-time"><span data-t="leave">Leave at</span>
            <input id="depart" name="depart" type="time" value="18:00" required>
          </label>
          <div class="seg" role="group" aria-label="Day">
            <button type="button" class="seg-btn" data-day="weekday" aria-pressed="true" data-t="weekday">Weekday</button>
            <button type="button" class="seg-btn" data-day="weekend" aria-pressed="false" data-t="weekend">Weekend</button>
          </div>
        </div>
        <button type="submit" class="primary" data-t="plan">Plan</button>
      </form>

      <div class="presets" id="presets" role="group" aria-label="Example trips"></div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="problem" class="problem" hidden></div>

    <div class="tools" id="tools" hidden>
      <button type="button" id="seat" class="toggle" aria-pressed="false" data-t="seat">I need a seat</button>
      <span id="seat-note" class="seat-note" role="status"></span>
    </div>

    <div id="notes" class="notes" hidden></div>
    <div id="results" class="results"></div>
  </main>

  <footer class="foot">
    <p>Data: Transport Stack / IIIT Delhi; ticketing from ONDC e-ticketing.</p>
    <p id="version" class="version"></p>
  </footer>

  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="sheet-title" class="sheet-title"></h2>
        <button type="button" class="close" id="sheet-close" data-close aria-label="Close">×</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <script src="/static/config.js" defer></script>
  <script src="/static/data.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
