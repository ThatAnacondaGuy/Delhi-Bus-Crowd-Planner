<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 724" width="960" height="724" role="img" aria-labelledby="t d"><title id="t">System architecture</title><desc id="d">Tickets, timetable and GPS feed go through an eight-stage pipeline into crowding tables, a validation report and documents; a planner and API serve the commuter screen, the operator view and the live demo.</desc><style>
