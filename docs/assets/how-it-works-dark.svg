</style><rect width="960" height="440" rx="14" fill="#0d1117" stroke="#30363d"/><text x="21" y="34" class="h1" fill="#e6edf3">How one ticket becomes a crowding level</text><text x="21" y="56" class="st" fill="#9aa7b4">Illustrative example with a made-up ticket. The real pipeline does this for every ticket, stretch and hour.</text><rect x="21" y="78" width="174" height="340" rx="12" fill="#151b23" stroke="#2a323c"/><rect class="lit" x="20" y="77" width="176" height="342" rx="13" fill="none" stroke="#2dd4bf" stroke-width="2.4" style="animation-delay:0.0s"/><circle cx="45" cy="106" r="12" fill="#2dd4bf"/><text x="45" y="111" text-anchor="middle" class="num" fill="#ffffff">1</text><text x="65" y="111" class="bt" fill="#e6edf3">A ticket</text><text x="35" y="340" class="cap" fill="#9aa7b4">Someone boards at Stop A</text><text x="35" y="356" class="cap" fill="#9aa7b4">and gets off at Stop D,</text><text x="35" y="372" class="cap" fill="#9aa7b4">on a bus of a known type.</text><path d="M198.0 101 l5 5 l-5 5" fill="none" stroke="#6e7b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="207" y="78" width="174" height="340" rx="12" fill="#151b23" stroke="#2a323c"/><rect class="lit" x="206" y="77" width="176" height="342" rx="13" fill="none" stroke="#2dd4bf" stroke-width="2.4" style="animation-delay:2.8s"/><circle cx="231" cy="106" r="12" fill="#2dd4bf"/><text x="231" y="111" text-anchor="middle" class="num" fill="#ffffff">2</text><text x="251" y="111" class="bt" fill="#e6edf3">Spread out</text><text x="221" y="340" class="cap" fill="#9aa7b4">Its ride is spread over</text><text x="221" y="356" class="cap" fill="#9aa7b4">each stretch it covers,</text><text x="221" y="372" class="cap" fill="#9aa7b4">at the time the bus was</text><text x="221" y="388" class="cap" fill="#9aa7b4">there.</text><path d="M384.0 101 l5 5 l-5 5" fill="none" stroke="#6e7b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="393" y="78" width="174" height="340" rx="12" fill="#151b23" stroke="#2a323c"/><rect class="lit" x="392" y="77" width="176" height="342" rx="13" fill="none" stroke="#2dd4bf" stroke-width="2.4" style="animation-delay:5.6s"/><circle cx="417" cy="106" r="12" fill="#2dd4bf"/><text x="417" y="111" text-anchor="middle" class="num" fill="#ffffff">3</text><text x="437" y="111" class="bt" fill="#e6edf3">Scaled up</text><text x="407" y="340" class="cap" fill="#9aa7b4">App tickets are a sample.</text><text x="407" y="356" class="cap" fill="#9aa7b4">We scale up to everyone</text><text x="407" y="372" class="cap" fill="#9aa7b4">on board, never above</text><text x="407" y="388" class="cap" fill="#9aa7b4">what a bus can hold.</text><path d="M570.0 101 l5 5 l-5 5" fill="none" stroke="#6e7b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="579" y="78" width="174" height="340" rx="12" fill="#151b23" stroke="#2a323c"/><rect class="lit" x="578" y="77" width="176" height="342" rx="13" fill="none" stroke="#2dd4bf" stroke-width="2.4" style="animation-delay:8.399999999999999s"/><circle cx="603" cy="106" r="12" fill="#2dd4bf"/><text x="603" y="111" text-anchor="middle" class="num" fill="#ffffff">4</text><text x="623" y="111" class="bt" fill="#e6edf3">Compared</text><text x="593" y="340" class="cap" fill="#9aa7b4">People on board are</text><text x="593" y="356" class="cap" fill="#9aa7b4">compared with the bus's</text><text x="593" y="372" class="cap" fill="#9aa7b4">seats and its rated</text><text x="593" y="388" class="cap" fill="#9aa7b4">total.</text><path d="M756.0 101 l5 5 l-5 5" fill="none" stroke="#6e7b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="765" y="78" width="174" height="340" rx="12" fill="#151b23" stroke="#2a323c"/><rect class="lit" x="764" y="77" width="176" height="342" rx="13" fill="none" stroke="#2dd4bf" stroke-width="2.4" style="animation-delay:11.2s"/><circle cx="789" cy="106" r="12" fill="#2dd4bf"/><text x="789" y="111" text-anchor="middle" class="num" fill="#ffffff">5</text><text x="809" y="111" class="bt" fill="#e6edf3">A level</text><text x="779" y="340" class="cap" fill="#9aa7b4">Seats, standing or</text><text x="779" y="356" class="cap" fill="#9aa7b4">crowded: a word, dots and</text><text x="779" y="372" class="cap" fill="#9aa7b4">colour. If we know too</text><text x="779" y="388" class="cap" fill="#9aa7b4">little, we say so.</text><g class="a r0"><rect x="43" y="142" width="130" height="150" rx="10" fill="#1c232c" stroke="#3d4752" stroke-width="1.5"/><text x="57" y="166" class="tk" fill="#9aa7b4">BOARDS</text><text x="57" y="186" class="bt" fill="#e6edf3">Stop A</text><line x1="55" y1="204" x2="161" y2="204" stroke="#3d4752" stroke-dasharray="4 4"/><text x="57" y="226" class="tk" fill="#9aa7b4">GETS OFF</text><text x="57" y="246" class="bt" fill="#e6edf3">Stop D</text><text x="57" y="274" class="tk" fill="#9aa7b4">12 m bus, morning</text><circle cx="43" cy="204" r="6" fill="#151b23"/><circle cx="173" cy="204" r="6" fill="#151b23"/></g><line x1="231" y1="268" x2="357" y2="268" stroke="#6e7b88" stroke-width="3" stroke-linecap="round"/><circle cx="231.0" cy="268" r="5" fill="#1c232c" stroke="#e6edf3" stroke-width="2"/><text x="231.0" y="290" text-anchor="middle" class="tk" fill="#e6edf3">A</text><circle cx="273.0" cy="268" r="5" fill="#1c232c" stroke="#e6edf3" stroke-width="2"/><text x="273.0" y="290" text-anchor="middle" class="tk" fill="#e6edf3">B</text><circle cx="315.0" cy="268" r="5" fill="#1c232c" stroke="#e6edf3" stroke-width="2"/><text x="315.0" y="290" text-anchor="middle" class="tk" fill="#e6edf3">C</text><circle cx="357.0" cy="268" r="5" fill="#1c232c" stroke="#e6edf3" stroke-width="2"/><text x="357.0" y="290" text-anchor="middle" class="tk" fill="#e6edf3">D</text><g class="a r1" style="transform-box:fill-box;transform-origin:50% 100%"><rect x="236.0" y="220" width="32.0" height="34" rx="4" fill="#2dd4bf" opacity=".85"/></g><g class="a r2" style="transform-box:fill-box;transform-origin:50% 10