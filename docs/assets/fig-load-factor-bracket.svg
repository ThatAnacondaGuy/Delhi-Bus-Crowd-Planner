<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-label="Load-factor bracket against the published band"><title>Load-factor bracket against the published band</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;fill:#1d2327}.ti{font-size:17px;font-weight:700}.su{font-size:12.5px;fill:#566069}.lb{font-size:12px}.ax{font-size:11px;fill:#566069}.src{font-size:10.5px;fill:#566069}.bd{font-size:12px;font-weight:700}</style><rect width="760" height="370" rx="14" fill="#fbfaf7" stroke="#e3e0d6"/><text x="24" y="34" class="ti">The published load factor (78%-89%) lies between what the model</text><text x="24" y="58" class="ti">places and full allocation</text><text x="24" y="80" class="su">Weekday passenger-km divided by seat-km, scheduled service on commuter-facing cells</text><rect x="319.8" y="110" width="36.1" height="189" fill="#0f766e" opacity=".13"/><text x="337.9" y="106.0" class="bd" text-anchor="middle" fill="#0f766e">published 78%-89%</text><line x1="64" y1="293" x2="720" y2="293" stroke="#566069"/><line x1="64.0" y1="293" x2="64.0" y2="298" stroke="#566069"/><text x="64.0" y="312.0" class="ax" text-anchor="middle">0%</text><line x1="228.0" y1="293" x2="228.0" y2="298" stroke="#566069"/><text x="228.0" y="312.0" class="ax" text-anchor="middle">50%</text><line x1="392.0" y1="293" x2="392.0" y2="298" stroke="#566069"/><text x="392.0" y="312.0" class="ax" text-anchor="middle">100%</text><line x1="556.0" y1="293" x2="556.0" y2="298" stroke="#566069"/><text x="556.0" y="312.0" class="ax" text-anchor="middle">150%</text><line x1="720.0" y1="293" x2="720.0" y2="298" stroke="#566069"/><text x="720.0" y="312.0" class="ax" text-anchor="middle">200%</text><line x1="64" y1="144" x2="241.1" y2="144" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><circle cx="241.1" cy="144" r="6" fill="#0f766e" stroke="#fbfaf7" stroke-width="2"/><text x="64.0" y="134.0" class="bd" text-anchor="start" fill="#0f766e">Model as is: 54%</text><text x="64.0" y="162.0" class="ax" text-anchor="start">below the published band: it only places riders it can place</text><line x1="64" y1="196" x2="414.9" y2="196" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><circle cx="414.9" cy="196" r="6" fill="#b45309" stroke="#fbfaf7" stroke-width="2"/><text x="64.0" y="186.0" class="bd" text-anchor="start" fill="#b45309">Full allocation, capped at crush: 107%</text><text x="64.0" y="214.0" class="ax" text-anchor="start">above the published band</text><line x1="64" y1="248" x2="620.5" y2="248" stroke="#8f1d1d" stroke-width="3" stroke-linecap="round"/><circle cx="620.5" cy="248" r="6" fill="#8f1d1d" stroke="#fbfaf7" stroke-width="2"/><text x="64.0" y="238.0" class="bd" text-anchor="start" fill="#8f1d1d">Full allocation, no cap: 170%</text><text x="64.0" y="266.0" class="ax" text-anchor="start">1.9x the top of the band: more riders than buses can hold</text><text x="24" y="356" class="src">Source: validation_report.json (headline numbers). Definitions differ from the published survey figure, so this is a rough check.</text></svg>
