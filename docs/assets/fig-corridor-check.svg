<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-label="Corridor check against its chance baseline"><title>Corridor check against its chance baseline</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;fill:#1d2327}.ti{font-size:17px;font-weight:700}.su{font-size:12.5px;fill:#566069}.lb{font-size:12px}.ax{font-size:11px;fill:#566069}.src{font-size:10.5px;fill:#566069}.bd{font-size:12px;font-weight:700}</style><rect width="760" height="410" rx="14" fill="#fbfaf7" stroke="#e3e0d6"/><text x="24" y="34" class="ti">Passing the corridor rule is easy by chance, so we also check</text><text x="24" y="58" class="ti">enrichment: 19% of corridor stretches are in the busiest tenth</text><text x="24" y="80" class="su">Ten outside-evidence corridors tested against the model's busiest stretches</text><text x="64.0" y="118.0" class="bd" text-anchor="start">Corridors passing the rule (of 10)</text><rect x="84" y="144.0" width="62" height="175.0" rx="3" fill="#0f766e"/><text x="115.0" y="137.0" class="bd" text-anchor="middle">10</text><text x="115.0" y="337.0" class="lb" text-anchor="middle">Model</text><rect x="180" y="144.1" width="62" height="174.9" rx="3" fill="#9aa3ab"/><text x="211.0" y="137.1" class="bd" text-anchor="middle">9.99</text><text x="211.0" y="337.0" class="lb" text-anchor="middle">Chance</text><rect x="276" y="196.5" width="62" height="122.5" rx="3" fill="#0f766e" opacity=".7"/><text x="307.0" y="189.5" class="bd" text-anchor="middle">7</text><text x="307.0" y="337.0" class="lb" text-anchor="middle">Both ends</text><line x1="64" y1="319" x2="360" y2="319" stroke="#566069"/><text x="64.0" y="359.0" class="ax" text-anchor="start">Both ends: only stretches with both stops on the corridor.</text><text x="440.0" y="118.0" class="bd" text-anchor="start">Corridor stretches in the network's busiest 10%</text><rect x="480" y="179.0" width="62" height="140.0" rx="3" fill="#0f766e"/><text x="511.0" y="172.0" class="bd" text-anchor="middle">19%</text><text x="511.0" y="337.0" class="lb" text-anchor="middle">Model</text><rect x="600" y="245.2" width="62" height="73.8" rx="3" fill="#9aa3ab"/><text x="631.0" y="238.2" class="bd" text-anchor="middle">10%</text><text x="631.0" y="337.0" class="lb" text-anchor="middle">Chance</text><line x1="440" y1="319" x2="736" y2="319" stroke="#566069"/><text x="440.0" y="359.0" class="ax" text-anchor="start">1.9x the chance level is the signal; the pass count is not.</text><text x="24" y="382" class="src">Source: validation_report.json. Chance baseline: seeded simulation, 2000 draws per corridor, seed 25, stretches drawn without</text><text x="24" y="396" class="src">replacement from the 12,603 weekday stretches with service.</text></svg>
